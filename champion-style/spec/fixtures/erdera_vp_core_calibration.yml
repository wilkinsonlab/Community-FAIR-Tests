# Calibration corpus for ERDERA VP CORE title/description quality.
# label: junk = should FAIL, ok = minimal but useful (should PASS), good = clearly useful.
# Written from judgement (Claude, reviewed by Mark Wilkinson, 2026-11-21), not taken
# from the Lean FDP Index, which is what this test quality-controls. Titles and
# descriptions exist for DISCOVERY, so "useful" means "contains words a searcher could
# use"; generic text and LLM-style filler are junk however long they are.
# Descriptions carry the record's title so "adds nothing beyond the title" can be measured.
#
# Used by spec/tests/erdera_vp_core_quality_spec.rb, which requires every junk entry to
# fail and every ok/good entry to pass under the test's own scoring code. If you change
# the thresholds or word lists in app/tests/erdera_vp_core_quality.rb, this spec tells
# you which labelled examples flip.
#
# Calibration (2026-11-21), best cutoff for each candidate measure on this corpus:
#   titles:       words >= 4                  -> 4/24 junk pass, 10/18 useful fail
#                 distinctive words >= 1      -> 0 junk pass, 0 useful fail   (adopted)
#   descriptions: characters >= 40 (200 worse) -> 8/28 junk pass (LLM filler is long)
#                 distinctive words not in the title >= 1 -> 0 / 0
#                 ... >= 2 adopted by Mark as the stricter discovery bar (relabels 2 items below)

titles:
  junk:
    - "Dataset"
    - "Test"
    - "test"
    - "Untitled"
    - "Data"
    - "My FDP"
    - "FAIR Data Point"
    - "My FAIR Data Point"
    - "New dataset"
    - "Test catalog"
    - "Catalog 1"
    - "dataset_v2_final"
    - "Demo FDP"
    - "Copy of dataset"
    - "Registry"
    - "Biobank"
    - "Rare disease data"
    - "Rare disease dataset 2024"
    - "Catalogue"
    - "Example distribution"
    - "This is my test catalog"
    - "A new FAIR data point"
    - "Data service"
    - "Patient registry"
  ok:
    - "Orphanet"
    - "BBMRI-ERIC Directory"
    - "VEP FAIR Data Point"
    - "ERN-RND Registry"
    - "EuRR-Bone"
    - "Treatabolome"
    - "Cystic fibrosis biobank"
    - "Duchenne registry Spain"
    - "Fabry natural history data"
    - "EATRIS catalogue"
    - "Solve-RD exomes"
    - "HPO annotations"
  good:
    - "EJP RD Innovation Management Toolbox"
    - "Spanish Registry of Duchenne Muscular Dystrophy Patients"
    - "Natural history study of Fabry disease in adults"
    - "Whole-exome sequences from the Solve-RD unsolved cases cohort"
    - "BBMRI-ERIC Directory of European biobanks"
    - "ERN-RND registry of rare neurological diseases"

